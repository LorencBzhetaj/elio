# Local PostgreSQL for development and for running the integration tests against a real server:
#   docker compose up -d db
#   TEST_DATABASE_URL=postgres://albania:albania@localhost:5433/albania_test npm test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: albania
      POSTGRES_PASSWORD: albania
      POSTGRES_DB: albania
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  testdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: albania
      POSTGRES_PASSWORD: albania
      POSTGRES_DB: albania_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
volumes:
  pgdata:
